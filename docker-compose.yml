services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "User Id=SYSTEM;Password=${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in your environment};Data Source=oracle:1521/FREEPDB1"

  oracle:
    image: container-registry.oracle.com/database/free:latest
    environment:
      ORACLE_PWD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in your environment}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
