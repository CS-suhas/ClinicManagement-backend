services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      liquibase:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "User Id=SYSTEM;Password=${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in your environment};Data Source=oracle:1521/FREEPDB1"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

  oracle:
    image: container-registry.oracle.com/database/free:latest
    environment:
      ORACLE_PWD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in your environment}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata

  liquibase:
    build:
      context: ./liquibase
      dockerfile: Dockerfile
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: "jdbc:oracle:thin:@oracle:1521/FREEPDB1"
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
      LIQUIBASE_COMMAND_USERNAME: SYSTEM
      LIQUIBASE_COMMAND_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in your environment}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.xml
    volumes:
      - ./liquibase/changelog:/liquibase/changelog
    command: update

volumes:
  oracle-data:
