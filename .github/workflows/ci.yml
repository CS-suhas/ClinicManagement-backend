name: CI

on:
  push:

jobs:
  # False positives: `// nosemgrep: <rule-id>` on the line, with the reason.
  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Semgrep scan
        run: >-
          semgrep scan --metrics=off --error
          --config p/owasp-top-ten --config p/secrets --config p/csharp
          --config p/javascript --config p/dockerfile --config p/github-actions

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart@sha256:cebd977833411a42170777d8e9ccf616a028a2bb137ae96498354ab6c7510268
        env:
          ORACLE_PASSWORD: test_system_password
          APP_USER: clinic_test
          APP_USER_PASSWORD: clinic_test_password
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 30s
          --health-retries 30
    env:
      TEST_DATABASE_CONNECTION_STRING: "User Id=clinic_test;Password=clinic_test_password;Data Source=localhost:1521/FREEPDB1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Apply database migrations
        run: |
          docker build --tag clinic-management-liquibase ./liquibase
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/liquibase/changelog:/liquibase/changelog:ro" \
            --env LIQUIBASE_COMMAND_URL=jdbc:oracle:thin:@localhost:1521/FREEPDB1 \
            --env LIQUIBASE_SEARCH_PATH=/liquibase/changelog \
            --env LIQUIBASE_COMMAND_USERNAME=clinic_test \
            --env LIQUIBASE_COMMAND_PASSWORD=clinic_test_password \
            --env LIQUIBASE_COMMAND_CHANGELOG_FILE=db.changelog-master.xml \
            clinic-management-liquibase update
      - name: Run tests
        run: dotnet test ClinicManagement.slnx --configuration Release
