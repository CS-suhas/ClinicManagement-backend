name: Publish container image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_suffix: ""
            context: .
            file: Dockerfile
          - image_suffix: "-liquibase"
            context: ./liquibase
            file: liquibase/Dockerfile
          - image_suffix: "-seeder"
            context: ./faker
            file: faker/Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,value=${{ github.event.workflow_run.head_sha }}

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: local/scan:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.file }}
          cache-to: type=gha,mode=max,scope=${{ matrix.file }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          image-ref: local/scan:${{ github.event.workflow_run.head_sha }}
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.file }}
          cache-to: type=gha,mode=max,scope=${{ matrix.file }}

  promote:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image names
        id: image
        shell: bash
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "names<<EOF"
            echo "$base"
            echo "$base-liquibase"
            echo "$base-seeder"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ steps.image.outputs.names }}
          tags: |
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=${{ github.event.workflow_run.head_branch }},enable=${{ startsWith(github.event.workflow_run.head_branch, 'v') }}
            type=semver,pattern={{version}},value=${{ github.event.workflow_run.head_branch }},enable=${{ startsWith(github.event.workflow_run.head_branch, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.workflow_run.head_branch }},enable=${{ startsWith(github.event.workflow_run.head_branch, 'v') }}

      - name: Point release tags at this commit's images
        shell: bash
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          source_tag="sha-${HEAD_SHA::7}"
          while read -r tag; do
            [ -z "$tag" ] && continue
            image="${tag%:*}"
            echo "$tag -> $image:$source_tag"
            docker buildx imagetools create --tag "$tag" "$image:$source_tag"
          done <<< "$TAGS"

  deploy:
    needs: promote
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions: {}
    concurrency:
      group: bump-deploy-repo
      cancel-in-progress: false
    steps:
      - name: Check out deploy repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: CS-suhas/ClinicManagement-Deploy
          ssh-key: ${{ secrets.DEPLOY_REPO_SSH_KEY }}

      - name: Set API_TAG in versions.env and push
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="sha-${HEAD_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            sed -i "s/^API_TAG=.*/API_TAG=$tag/" versions.env
            if git diff --quiet; then echo "versions.env already has API_TAG=$tag"; exit 0; fi
            git commit -qam "chore: deploy api $tag"
            if git push -q origin HEAD:main; then echo "Pushed API_TAG=$tag"; exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push to ClinicManagement-Deploy"; exit 1
