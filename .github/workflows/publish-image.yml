name: Publish container image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

# Promotions must not interleave, or `latest` could end up on an older commit.
concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  # Builds the API, Liquibase and seeder images for one commit and pushes only the
  # immutable `sha-<commit>` tag. Moving tags are set by `promote`.
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_suffix: ""
            context: .
            file: Dockerfile
          - image_suffix: "-liquibase"
            context: ./liquibase
            file: liquibase/Dockerfile
          - image_suffix: "-seeder"
            context: ./faker
            file: faker/Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,value=${{ github.event.workflow_run.head_sha }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.file }}
          cache-to: type=gha,mode=max,scope=${{ matrix.file }}

  # Runs only when all images were published, then points `latest` / version
  # tags of every image at the same commit, so they can never diverge.
  promote:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image names
        id: image
        shell: bash
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "names<<EOF"
            echo "$base"
            echo "$base-liquibase"
            echo "$base-seeder"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.names }}
          tags: |
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=${{ github.event.workflow_run.head_branch }},enable=${{ startsWith(github.event.workflow_run.head_branch, 'v') }}
            type=semver,pattern={{version}},value=${{ github.event.workflow_run.head_branch }},enable=${{ startsWith(github.event.workflow_run.head_branch, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.workflow_run.head_branch }},enable=${{ startsWith(github.event.workflow_run.head_branch, 'v') }}

      - name: Point release tags at this commit's images
        shell: bash
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          source_tag="sha-${HEAD_SHA::7}"
          while read -r tag; do
            [ -z "$tag" ] && continue
            image="${tag%:*}"
            echo "$tag -> $image:$source_tag"
            docker buildx imagetools create --tag "$tag" "$image:$source_tag"
          done <<< "$TAGS"

  # Points the deploy repo's versions.env at this build; that push redeploys the server
  # (ClinicManagement-Deploy, .github/workflows/deploy.yml). main only, after promote.
  deploy:
    needs: promote
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions: {}
    concurrency:
      group: bump-deploy-repo
      cancel-in-progress: false
    steps:
      - name: Check out deploy repo
        uses: actions/checkout@v4
        with:
          repository: CS-suhas/ClinicManagement-Deploy
          ssh-key: ${{ secrets.DEPLOY_REPO_SSH_KEY }}

      - name: Set API_TAG in versions.env and push
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="sha-${HEAD_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retry: the other app repo may push a bump at the same time.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            sed -i "s/^API_TAG=.*/API_TAG=$tag/" versions.env
            if git diff --quiet; then echo "versions.env already has API_TAG=$tag"; exit 0; fi
            git commit -qam "chore: deploy api $tag"
            if git push -q origin HEAD:main; then echo "Pushed API_TAG=$tag"; exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push to ClinicManagement-Deploy"; exit 1
